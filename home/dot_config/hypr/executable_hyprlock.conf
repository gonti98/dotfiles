background {
    color = rgba(17, 17, 27, 1.0)
}

label {
    text = cmd[update:1000] date +%H:%M
    font_size = 72
    font_family = FiraCode Nerd Font Mono
    color = rgba(255, 255, 255, 0.9)
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    check_color = rgb(76, 175, 80)
    fail_color = rgb(244, 67, 54)
}
